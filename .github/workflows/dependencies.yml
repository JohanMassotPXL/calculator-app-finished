name: Dependencies Example
on:
  workflow_dispatch: 

jobs:
  Dependencies_Example:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1
        - name: Use Node.js ${{ matrix.node-version }}
          uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node-version }}
        - name: Verification
          run: ls -alhR
    
