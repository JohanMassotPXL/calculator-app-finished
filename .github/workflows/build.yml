name: Build Example

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the code
        run: |
          npm install
          zip -r app.zip . -x ".git/*" ".github/*"

      - name: Test the code
        run: |
          npm test -- --coverage --testLocationInResults
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test -- --coverage --testLocationInResults
      - name: Publish test and coverage report
        uses: mridang/action-test-reporter@v1
        with:
          name: Unit tests
          results-path: ./.out/junit.xml
          coverage-path: coverage/lcov.info
