
name: Dependencies Example
on:
  workflow_dispatch: 

jobs:
  Dependencies_Example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the code
        run: zip -r build.zip .
      - name: Test the code
        run: npm test
    
